name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/workflows/issue_moderator.yml'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  CI_CHUNK_SIZE: 65

jobs:
  build_individual:
    name: Build individual modules and publish repo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            if [ "$GITHUB_REPOSITORY" = "tachiyomiorg/extensions" ]; then
              echo "::error::The SIGNING_KEY secret is required to publish signed APKs"
              exit 1
            fi
            echo "::notice::SIGNING_KEY is not set; building unsigned release APKs"
            exit 0
          fi
          echo "$SIGNING_KEY" | base64 -d > signingkey.jks

      - name: Build extensions
        uses: gradle/gradle-build-action@v2
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        with:
          arguments: assembleRelease

      # Publishing used to run in a separate job that received the APKs via
      # actions/upload-artifact + download-artifact. It now runs in this job so
      # no Actions artifact storage is used: the APKs are staged into the same
      # ~/apk-artifacts directory the old download step produced, which
      # .github/scripts/move-apks.sh reads.
      - name: Stage APKs for publishing
        if: "github.repository == 'tachiyomiorg/extensions'"
        run: |
          shopt -s globstar nullglob
          DEST=~/apk-artifacts/individual-apks
          rm -rf ~/apk-artifacts && mkdir -p "$DEST"
          APKS=( **/*.apk )
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No APKs were built"
            exit 1
          fi
          cp --parents "${APKS[@]}" "$DEST"
          echo "Staged ${#APKS[@]} APKs"

      - name: Clean up CI files
        if: always()
        run: rm -f signingkey.jks

      - name: Set up JDK 17 for publishing
        if: "github.repository == 'tachiyomiorg/extensions'"
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: adopt

      - name: Checkout main branch for publishing
        if: "github.repository == 'tachiyomiorg/extensions'"
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Create repo artifacts
        if: "github.repository == 'tachiyomiorg/extensions'"
        run: |
          cd main
          ./.github/scripts/move-apks.sh
          INSPECTOR_LINK="$(curl -s "https://api.github.com/repos/tachiyomiorg/tachiyomi-extensions-inspector/releases/latest" | jq -r '.assets[0].browser_download_url')"
          curl -L "$INSPECTOR_LINK" -o ./Inspector.jar
          java -jar ./Inspector.jar "apk" "output.json" "tmp"
          ./.github/scripts/create-repo.sh

      - name: Checkout repo branch
        if: "github.repository == 'tachiyomiorg/extensions'"
        uses: actions/checkout@v4
        with:
          ref: repo
          path: repo

      - name: Deploy repo
        if: "github.repository == 'tachiyomiorg/extensions'"
        run: |
          cd repo
          ../main/.github/scripts/commit-repo.sh
